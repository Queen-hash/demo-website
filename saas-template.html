<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusOps — Enterprise Cloud & SaaS Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full text-slate-100 font-sans antialiased" x-data="{ 
    sidebarOpen: false,
    activeTab: 'overview',
    stats: [
        { title: 'Total Revenue', value: '$48,250.00', change: '+12.4%', positive: true, icon: 'fa-wallet' },
        { title: 'Active Subscribers', value: '2,450', change: '+8.1%', positive: true, icon: 'fa-users' },
        { title: 'Server Uptime', value: '99.98%', change: '+0.02%', positive: true, icon: 'fa-server' },
        { title: 'Avg. Latency', value: '42ms', change: '-4ms', positive: true, icon: 'fa-bolt' }
    ],
    transactions: [
        { id: '#INV-8942', client: 'Acme Corp', plan: 'Enterprise Annual', amount: '$12,400.00', status: 'Completed', date: 'Today, 14:20' },
        { id: '#INV-8941', client: 'Globex Industries', plan: 'Pro Monthly', amount: '$499.00', status: 'Completed', date: 'Today, 11:05' },
        { id: '#INV-8940', client: 'Stark Enterprises', plan: 'Enterprise Custom', amount: '$24,000.00', status: 'Pending', date: 'Yesterday' },
        { id: '#INV-8939', client: 'Wayne Tech', plan: 'Pro Annual', amount: '$4,990.00', status: 'Completed', date: 'Yesterday' }
    ]
}">

    <div class="min-h-full flex">
        <!-- Sidebar -->
        <aside class="hidden lg:flex lg:flex-shrink-0">
            <div class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between p-6">
                <div class="space-y-8">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">
                            <i class="fa-solid fa-cube"></i>
                        </div>
                        <span class="text-lg font-bold tracking-tight text-white">NEXUSOPS</span>
                    </div>

                    <nav class="space-y-1">
                        <a href="#" @click="activeTab = 'overview'" :class="activeTab === 'overview' ? 'bg-indigo-600/10 text-indigo-400 border-indigo-600' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium border border-transparent transition">
                            <i class="fa-solid fa-chart-pie w-5"></i>
                            <span>Overview</span>
                        </a>
                        <a href="#" @click="activeTab = 'analytics'" :class="activeTab === 'analytics' ? 'bg-indigo-600/10 text-indigo-400 border-indigo-600' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium border border-transparent transition">
                            <i class="fa-solid fa-chart-line w-5"></i>
                            <span>Analytics</span>
                        </a>
                        <a href="#" @click="activeTab = 'customers'" :class="activeTab === 'customers' ? 'bg-indigo-600/10 text-indigo-400 border-indigo-600' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium border border-transparent transition">
                            <i class="fa-solid fa-user-group w-5"></i>
                            <span>Customers</span>
                        </a>
                        <a href="#" @click="activeTab = 'settings'" :class="activeTab === 'settings' ? 'bg-indigo-600/10 text-indigo-400 border-indigo-600' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium border border-transparent transition">
                            <i class="fa-solid fa-gear w-5"></i>
                            <span>Settings</span>
                        </a>
                    </nav>
                </div>

                <div class="pt-6 border-t border-slate-800 flex items-center space-x-3">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar" class="w-10 h-10 rounded-full object-cover">
                    <div>
                        <h4 class="text-sm font-semibold text-white">Sarah Jenkins</h4>
                        <span class="text-xs text-slate-500">Admin Owner</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="bg-slate-950/60 backdrop-blur-md border-b border-slate-800 h-20 flex items-center justify-between px-6 lg:px-10">
                <div class="flex items-center space-x-4">
                    <h1 class="text-xl font-bold text-white capitalize" x-text="activeTab"></h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span>
                        System Operational
                    </span>
                    <a href="https://wa.me/6281234567890?text=Halo%2C%20saya%20tertarik%20dengan%20SaaS%20Dashboard%20NexusOps" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-semibold text-xs transition shadow-sm">
                        Hubungi Developer
                    </a>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-6 lg:p-10 space-y-8 bg-slate-900">
                <!-- Stats Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <template x-for="stat in stats">
                        <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 shadow-sm space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-medium text-slate-400" x-text="stat.title"></span>
                                <div class="w-8 h-8 rounded-lg bg-indigo-600/10 text-indigo-400 flex items-center justify-center">
                                    <i class="fa-solid" :class="stat.icon"></i>
                                </div>
                            </div>
                            <div class="flex items-baseline justify-between">
                                <h3 class="text-2xl font-bold text-white" x-text="stat.value"></h3>
                                <span class="text-xs font-semibold text-emerald-400" x-text="stat.change"></span>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Recent Transactions Table -->
                <div class="bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden">
                    <div class="p-6 border-b border-slate-800 flex items-center justify-between">
                        <h3 class="text-base font-bold text-white">Recent Transactions</h3>
                        <button class="text-xs font-semibold text-indigo-400 hover:text-indigo-300">View All</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-300">
                            <thead class="bg-slate-900/50 text-xs uppercase text-slate-400 font-semibold border-b border-slate-800">
                                <tr>
                                    <th class="px-6 py-4">Invoice ID</th>
                                    <th class="px-6 py-4">Client</th>
                                    <th class="px-6 py-4">Plan</th>
                                    <th class="px-6 py-4">Amount</th>
                                    <th class="px-6 py-4">Status</th>
                                    <th class="px-6 py-4">Date</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                <template x-for="tx in transactions">
                                    <tr class="hover:bg-slate-900/30 transition">
                                        <td class="px-6 py-4 font-mono text-xs text-indigo-400" x-text="tx.id"></td>
                                        <td class="px-6 py-4 font-semibold text-white" x-text="tx.client"></td>
                                        <td class="px-6 py-4 text-slate-400" x-text="tx.plan"></td>
                                        <td class="px-6 py-4 font-mono font-medium text-white" x-text="tx.amount"></td>
                                        <td class="px-6 py-4">
                                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold" :class="tx.status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'" x-text="tx.status"></span>
                                        </td>
                                        <td class="px-6 py-4 text-xs text-slate-500" x-text="tx.date"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
